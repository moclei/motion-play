; V7R-012 drive builds: v7_drive_bq_probe (V7R-009 u3-scope + GPIO43 drive set/read back) on U3.
; u3-drv2 and u3-drv3 differ only in -DSDA_DRIVE_CAP.
; Board, core, flags and memory config copied from v7-clean [env:motion-play-v7],
; minus lib_deps (sketch uses Wire only), -Ifirmware/include, SERIAL_STUDIO/STARTUP_I2C_SCAN (not read by the sketch).
[env:u3-drv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.14
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0
build_type = debug
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi

[env:u3-drv2]
extends = env:u3-drv
build_flags =
    ${env:u3-drv.build_flags}
    -DSDA_DRIVE_CAP=GPIO_DRIVE_CAP_2

[env:u3-drv3]
extends = env:u3-drv
build_flags =
    ${env:u3-drv.build_flags}
    -DSDA_DRIVE_CAP=GPIO_DRIVE_CAP_3
