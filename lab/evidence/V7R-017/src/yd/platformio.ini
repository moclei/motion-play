; V7R-017 dev-board static build: yd_static_low (GPIO43 or GPIO4 held low as open-drain GPIO, no Wire) on the YD-ESP32-23 module.
; Env copied verbatim from V7R-014 u3-static (itself v7-clean [env:motion-play-v7]); only the name and sketch differ.
[env:yd-static]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.14
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0
build_type = debug
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi

