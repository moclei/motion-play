; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test
data_dir = firmware/data

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
platform_packages = 
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.14

; Clean build - only exclude specific test files and archive folder
; Use led_strip_test.cpp for LED testing, display_test.cpp for display testing, or main.cpp for full system
build_src_filter = +<*> -<sensor_direct_test.cpp> -<main_power_test.cpp> -<archive/> -<display_test.cpp> -<led_strip_test.cpp> -<tflite_smoke_test.cpp>

monitor_speed = 115200
monitor_filters = direct
upload_speed = 921600

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DSERIAL_STUDIO_DEFAULT=true
    -DSTARTUP_I2C_SCAN=false
    -DHAS_DISPLAY
    -DHAS_BUTTONS
    -Ifirmware/include
    -DUSER_SETUP_LOADED
    -include firmware/include/User_Setup.h

lib_deps =
    bodmer/TFT_eSPI@^2.5.31
    adafruit/Adafruit BusIO@^1.14.5
    adafruit/Adafruit VCNL4040@^1.1.4
    robtillaart/TCA9548@^0.3.0
    fastled/FastLED@^3.7.0
    ; Cloud connectivity libraries
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    ; ML inference
    spaziochirale/Chirale_TensorFLowLite@^2.0.0

build_type = debug

; Partition scheme with filesystem support for 16MB flash
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.filesystem = littlefs

; Enable PSRAM
board_build.arduino.memory_type = qio_opi

; USB CDC On Boot settings
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:motion-play-v7]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.14

build_src_filter = +<*> -<sensor_direct_test.cpp> -<main_power_test.cpp> -<archive/> -<display_test.cpp> -<led_strip_test.cpp> -<tflite_smoke_test.cpp>

monitor_speed = 115200
monitor_filters = direct
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DSERIAL_STUDIO_DEFAULT=true
    -DSTARTUP_I2C_SCAN=true
    -Ifirmware/include

lib_deps =
    adafruit/Adafruit BusIO@^1.14.5
    adafruit/Adafruit VCNL4040@^1.1.4
    robtillaart/TCA9548@^0.3.0
    fastled/FastLED@^3.7.0
    ; Cloud connectivity libraries
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    ; ML inference
    spaziochirale/Chirale_TensorFLowLite@^2.0.0

build_type = debug

; ESP32-S3-WROOM-1-N16R8: 16MB flash, 8MB OPI PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.filesystem = littlefs

; Enable OPI PSRAM
board_build.arduino.memory_type = qio_opi

; USB CDC On Boot settings
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; Diagnostic build: identical to motion-play-v7 but skips WiFi/MQTT init and
; forces the ESP32 radio off. Use this when running the I2C bus diagnostic
; loop to rule out RF coupling into sensor cables. Upload with:
;   pio run -e motion-play-v7-diag -t upload
[env:motion-play-v7-diag]
extends = env:motion-play-v7
build_flags =
    ${env:motion-play-v7.build_flags}
    -DDIAG_NO_WIFI

; Bus-recovery test build: identical to motion-play-v7 but adds a
; 3x dummy START+STOP framing on the I2C bus after each TCA channel-open,
; before probing. Tests Story A from the v7 I2C investigation (BQ in a
; stuck state machine recoverable in software). Upload with:
;   pio run -e motion-play-v7-busrec -t upload
; Compare the BQ column on the TCA2 row against a baseline run of
; motion-play-v7 with the same hardware setup (cable + 10 kΩ from SDA
; to +3.3 V on J6). If BQ ACKs in this build but NACKs in baseline,
; Story A is confirmed and the fault is recoverable in software.
[env:motion-play-v7-busrec]
extends = env:motion-play-v7
build_flags =
    ${env:motion-play-v7.build_flags}
    -DBUS_RECOVERY_TEST

; Bus-release test build: boots only as far as configureBQ24195(), runs a
; short 5-iteration diagnostic burst to prove the failure reproduces on
; the ESP32 side, then closes all TCA/PCA channels for a clean baseline,
; calls Wire.end(), and reconfigures GPIO 43/44 (SDA/SCL) to INPUT (no
; internal pull). The on-board 2.2 kΩ pull-ups (R28/R29) hold the lines
; at idle high. ESP32 stays alive (so +3.3V, BQ config, watchdog-disabled
; state are all preserved) but the bus is electrically free for an
; external master to take over. Used for the Arduino-as-master
; discrimination test in the v7 I2C investigation (Story D-revised vs
; Story F). Upload with:
;   pio run -e motion-play-v7-relbus -t upload
; After the "BUS RELEASED" message appears, connect an Arduino Nano ESP32
; (or any 3.3V Arduino) to TPIO43 (SDA) / TPIO44 (SCL) / a GND test pad
; and run tools/arduino-sketches/v7_bq_master_probe/v7_bq_master_probe.ino.
[env:motion-play-v7-relbus]
extends = env:motion-play-v7
build_flags =
    ${env:motion-play-v7.build_flags}
    -DDIAG_RELEASE_I2C